<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emanuelle | Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background: linear-gradient(-45deg, #e66465, #9198e5, #f6d365, #c471ed);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      padding: 80px 20px 40px;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .social-links a {
      margin: 0 10px;
      font-size: 22px;
      color: white;
      transition: color 0.3s;
    }

    .social-links a:hover {
      color: #ffd700;
    }

    section {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .section-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease;
    }

    .section-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .section-box h2 {
      margin-top: 0;
    }

    .section-box img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      transition: transform 0.3s ease;
    }

    .section-box img:hover {
      transform: scale(1.05);
    }

    .experience i {
      margin-right: 10px;
    }

    .download-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background-color: #fff;
      color: #333;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }

    .download-btn:hover {
      background-color: #ffd700;
      color: #000;
    }

    .circle, .square {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 100px;
      height: 100px;
      animation: moveShape 8s linear infinite;
    }

    .square {
      border-radius: 0;
    }

    @keyframes move
